name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    name: Container on linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --platform linux/${{ matrix.arch }} -t minder-publish:ci .
      - run: python3 scripts/smoke-container.py --image minder-publish:ci
      - name: Bootstrap a clean Compose volume and verify HTTPS
        run: |
          cp .env.example .env
          sed -e 's/^    image: minder-publish:.*/    image: minder-publish:ci/' \
            -e 's/"80:8080"/"127.0.0.1::8080"/' -e 's/"443:8443"/"127.0.0.1::8443"/' \
            compose.yaml > compose.ci.yaml
          compose() { docker compose -p minder-publish-ci -f compose.ci.yaml "$@"; }
          cert_dir=$(mktemp -d)
          cleanup() {
            compose down --volumes --remove-orphans
            rm -f "$cert_dir/fullchain.pem" "$cert_dir/privkey.pem"
            rmdir "$cert_dir"
          }
          trap cleanup EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=publish.example.com -days 1 \
            -addext 'subjectAltName=DNS:publish.example.com,DNS:*.publish.example.com' \
            -keyout "$cert_dir/privkey.pem" -out "$cert_dir/fullchain.pem"
          sudo install -d -m 0750 -o 101 -g 101 deploy/publish/tls
          sudo install -m 0400 -o 101 -g 101 "$cert_dir/fullchain.pem" deploy/publish/tls/fullchain.pem
          sudo install -m 0400 -o 101 -g 101 "$cert_dir/privkey.pem" deploy/publish/tls/privkey.pem
          compose run --rm --no-deps -T --entrypoint python app \
            /opt/minder-publish/deploy/publish/render_config.py --env-file - --output - \
            < .env > deploy/publish/nginx.conf.tmp
          mv deploy/publish/nginx.conf.tmp deploy/publish/nginx.conf
          compose config --quiet
          password=$(openssl rand -hex 24)
          printf '%s\n' "$password" | compose run --rm --no-deps -T app bootstrap --username owner --password-stdin
          compose run --rm --no-deps proxy -t
          compose up --no-build -d --wait --wait-timeout 90
          endpoint=$(compose port proxy 8443)
          tls_request() {
            host=$1
            shift
            curl --silent --show-error --max-time 10 --noproxy '*' \
              --cacert "$cert_dir/fullchain.pem" --connect-to "$host:443:$endpoint" "$@"
          }
          tls_request publish.example.com --fail https://publish.example.com/healthz > /dev/null
          printf '{"username":"owner","password":"%s"}' "$password" | tls_request publish.example.com \
            --fail -H 'Origin: https://publish.example.com' -H 'Content-Type: application/json' \
            --data-binary @- https://publish.example.com/api/v1/auth/login > /dev/null
          revision=r-00000000000000000000000000000000.publish.example.com
          status=$(tls_request "$revision" -o /dev/null -w '%{http_code}' "https://$revision/__mp/unavailable")
          if [ "$status" != 404 ]; then
            printf 'Unexpected wildcard revision status: %s\n' "$status" >&2
            exit 1
          fi

  client:
    name: Client / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: >-
          python -m pytest -q tests/test_client_config.py tests/test_client_preflight.py
          tests/test_client_api.py tests/test_skill_install.py tests/test_client_setup.py
          tests/test_client_setup_pty.py tests/test_cli_output.py tests/test_client_concurrency.py
      - name: Installed client works outside the checkout
        run: python -c "import subprocess,sys,tempfile; subprocess.run([sys.executable,'-m','minder_publish.client.cli','--help'],cwd=tempfile.mkdtemp(),check=True)"

  server:
    name: Linux server / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the resolved release environment
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - name: Build a wheel and source distribution
        run: |
          python -m build --no-isolation
          python scripts/normalize-sdist.py dist/minder_publish-*.tar.gz
          python scripts/build-client-wheel.py
      - name: Audit source, server and public client artifacts
        run: |
          git archive --format=tar --prefix=minder-publish/ HEAD | gzip -n > dist/minder-publish-source.tar.gz
          python scripts/check-release.py dist/minder-publish-source.tar.gz --source-root . --git-tree HEAD
          python scripts/check-release.py dist/minder_publish-*.whl dist/minder_publish-*.tar.gz --source-root .
          python scripts/check-release.py --client-wheel dist/client/minder_publish-*.whl --source-root .
      - name: Install the built wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Domain, lifecycle, migration, auth, API and assets
        run: python -m pytest -q tests
      - name: Installed server and resources work outside the checkout
        run: |
          python - <<'PY'
          import importlib.resources
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          scratch = Path(tempfile.mkdtemp())
          subprocess.run([sys.executable, '-c', 'from minder_publish.server.commands import main; main()', '--help'], cwd=scratch, check=True)
          subprocess.run([sys.executable, '-c', "from importlib.resources import files; assert files('minder_publish').joinpath('server/web/index.html').is_file(); assert files('minder_publish').joinpath('defaults.json').is_file()"], cwd=scratch, check=True)
          PY
      - name: Validate deployment configuration without starting containers
        run: |
          cp .env.example .env
          python deploy/publish/render_config.py --env-file .env --output deploy/publish/nginx.conf
          docker compose config --quiet
      - name: Installed CLI replaces the previous full wheel and installs its skill
        run: |
          python -m pip install --no-deps --force-reinstall dist/client/*.whl
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from importlib.metadata import distribution
          from importlib.util import find_spec
          from pathlib import Path
          scratch = Path(tempfile.mkdtemp()).resolve()
          env = {**os.environ, "MINDER_PUBLISH_CONFIG_DIR": str(scratch / "config")}
          cli = Path(sys.executable).with_name("minder-publish")
          result = subprocess.run(
              [str(cli), "skills", "--home", str(scratch), "--runtime", "codex", "--apply", "--json"],
              cwd=scratch, env=env, check=True, capture_output=True, text=True,
          )
          skill = Path(json.loads(result.stdout)["data"][0]["path"]).resolve()
          assert skill.is_relative_to(scratch) and skill.name == "SKILL.md" and skill.is_file()
          assert find_spec("minder_publish.server") is None
          assert find_spec("minder_publish.mcp") is None
          assert distribution("minder-publish").metadata["License-Expression"] == "MIT"
          assert not cli.with_name("minder-publish-server").exists()
          PY
      - name: Run preflight and API tests against the installed client wheel
        run: python -m pytest -q tests/test_client_preflight.py tests/test_client_api.py
